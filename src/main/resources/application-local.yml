# Points at the stacks in the local-docker repo (postgres/, kafka/ and keycloak/). Requires tokens like every profile.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # sample customers, local only
  datasource:
    url: jdbc:postgresql://localhost:5432/kafka_demo_customer_db
    username: kafka_demo_customer_local
    password: local
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/kafka-demo   # the local-docker Keycloak
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
